<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="320" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;family=Poppins:wght@800&amp;display=swap');
      .brand-title {
        font-family: 'Poppins', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .brand-tagline {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 3.1px;
      }
    </style>
    <linearGradient id="diamondGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#08553D"/>
    </linearGradient>
    <linearGradient id="sparkleGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Diamond Icon Group (Emerald 3D Facets & Sparkle) -->
  <g transform="translate(4, 6)">
    <polygon points="26,2 48,18 26,50 4,18" fill="url(#diamondGreenGrad)" filter="drop-shadow(0 4px 6px rgba(11,110,79,0.3))"/>
    <polygon points="26,2 48,18 36,18 26,2" fill="#86EFAC" opacity="0.85"/>
    <polygon points="26,2 4,18 16,18 26,2" fill="#BBF7D0" opacity="0.9"/>
    <polygon points="16,18 36,18 26,50" fill="#10B981" opacity="0.95"/>
    <polygon points="4,18 16,18 26,50" fill="#059669" opacity="0.9"/>
    <polygon points="48,18 36,18 26,50" fill="#065F46" opacity="0.9"/>
    <polygon points="16,18 26,2 36,18" fill="#DCFCE7"/>
    <path d="M42,6 L44,12 L50,14 L44,16 L42,22 L40,16 L34,14 L40,12 Z" fill="url(#sparkleGreenGrad)"/>
    <circle cx="10" cy="12" r="1.5" fill="#FFFFFF"/>
    <circle cx="44" cy="40" r="1.2" fill="#86EFAC"/>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="34" class="brand-title" fill="#08553D">DIAMOND</text>
  <text x="194" y="34" class="brand-title" fill="#16A34A">CLEAN</text>
  <text x="70" y="48" class="brand-tagline" fill="#69785A">SOLUSI KEBERSIHAN HOREKA 5L</text>
</svg>
